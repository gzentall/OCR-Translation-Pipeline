version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ocr-db
    environment:
      POSTGRES_DB: ocr_translation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Flask Application
  web:
    build: .
    container_name: ocr-web
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/ocr_translation
      - RESEND_API_KEY=${RESEND_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:5001}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=${FLASK_ENV:-development}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NOTION_API_KEY=${NOTION_API_KEY}
    volumes:
      # Mount directories for persistent data
      - ./letters:/app/letters
      - ./ocr_storage:/app/ocr_storage
      - ./static:/app/static
      # Mount API key files (read-only)
      - ./.gcp_api_key:/app/.gcp_api_key:ro
      - ./.openai_api_key:/app/.openai_api_key:ro
      - ./.notion_api_key:/app/.notion_api_key:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: ocr-network



